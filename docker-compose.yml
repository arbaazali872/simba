version: '3.8'

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db:/var/lib/postgresql/data
    ports:
      - "5433:5433"
    command: ["postgres", "-c", "port=5433"]
    networks:
      - simba-network

  web:
    # web builds the image and chainlit reuses it. Both used to have "build: .",
    # so the same Dockerfile was built twice in parallel: slower, and when one
    # build got interrupted the other showed up as CANCELED with no real error.
    build: .
    image: simba-app
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - SIMBA_API_URL=http://web:8000/api
      - ENVIRONMENT=development
      - BASE_URL=http://localhost:8000
      - EMAIL=${EMAIL}
      - EMAILAPPPWD=${EMAILAPPPWD}
    # There used to be a named volume mounted over /code here. Docker only fills
    # a volume from the image the first time, so after that it kept serving the
    # OLD code, and the only way to see changes was "down -v", which also wiped
    # the database. Nothing is written under /code at runtime except the error
    # log, so the code now simply comes from the image.
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    entrypoint: ["sh", "/code/entrypoint.sh"]
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - simba-network
  
  chainlit:
    image: simba-app
    # The image only exists locally (built by web); don't try to pull it from Docker Hub
    pull_policy: never
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - SIMBA_API_URL=http://web:8000/api
      - ENVIRONMENT=development
      - BASE_URL=http://localhost:8000
      - EMAIL=${EMAIL}
      - EMAILAPPPWD=${EMAILAPPPWD}
    command: ["chainlit", "run", "chainlit_app.py", "--host", "0.0.0.0", "--port", "8500"]
    ports:
      - "8500:8500"
    depends_on:
      - db
      - web
    networks:
      - simba-network
  
  

volumes:
  db:
  static_volume:
  media_volume:

networks:
  simba-network:
    driver: bridge
